matrix:
  platform: ["debian10", "macos", "macos_arm64", "ubuntu2004", "windows"]
  bazel: ["7.x", "8.x", "9.x"]

tasks:
  verify_targets:
    name: "Verify build targets"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_foreign_cc//toolchains/private:make_tool"
