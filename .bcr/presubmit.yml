bcr_test_module:
  module_path: "test/integration/basic"
  matrix:
    platform: ["debian11", "macos", "macos_arm64", "ubuntu2204", "windows"]
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_test:
      name: "Verify build targets"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_flags:
        - "--lockfile_mode=off"
        - "--noenable_workspace"
      build_targets:
        - "//..."
